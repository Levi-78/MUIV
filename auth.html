<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html">Главная</a>
      <a href="interests.html">Мои интересы</a>
      <a href="auth.html">Вход / Регистрация</a>
    </nav>
  </header>

  <main>
    <h1>Вход и регистрация</h1>

    <section class="forms">
      <div class="form-block">
        <h2>Вход</h2>
        <form>
          <label for="login-email">Email:</label>
          <input type="email" id="login-email" required>

          <label for="login-password">Пароль:</label>
          <input type="password" id="login-password" required>

          <button type="submit">Войти</button>
        </form>
      </div>

      <section class="form-block">
        <h2>Регистрация</h2>
        <form>
          <label for="reg-name">Имя:</label>
          <input type="text" id="reg-name" maxlength="50" required>

          <label for="reg-email">Email:</label>
          <input type="email" id="reg-email" required>

          <label for="reg-password">Пароль:</label>
          <input type="password" id="reg-password" required>

          <label for="reg-age">Возраст:</label>
          <select id="reg-age">
            <option>До 18</option>
            <option>18–24</option>
            <option>25 и старше</option>
          </select>

          <label for="reg-about">О себе:</label>
          <textarea id="reg-about" maxlength="300"></textarea>

          <button type="submit">Зарегистрироваться</button>
        </form>
      </section>
    </section>
  </main>

  <footer>
    <p>Levi</p>
  </footer>

</body>
</html>
